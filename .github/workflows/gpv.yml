name: Графік відключень

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хв (GitHub може запускати з запізненням)
  workflow_dispatch:          # кнопка "Run workflow" для ручного запуску

permissions:
  contents: write             # щоб зберігати state.bin

concurrency:
  group: gpv
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Перевірити канал і розіслати
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          ALLOWED_IDS: ${{ secrets.ALLOWED_IDS }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python run.py

      - name: Зберегти стан
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.bin)" ]; then
            git config user.name "gpv-bot"
            git config user.email "gpv-bot@users.noreply.github.com"
            git add state.bin
            git commit -m "update state"
            git push
          fi
